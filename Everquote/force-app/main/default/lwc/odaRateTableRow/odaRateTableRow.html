<template>
  <th data-label={amount} scope="row">
    <div class="slds-truncate" title={amount}>
      <strong
        ><lightning-formatted-number
          value={amount}
          format-style="currency"
          currency-code="USD"
        ></lightning-formatted-number
      ></strong>
    </div>
  </th>
  <template for:each={rates} for:item="rate">
    <td key={rate} data-label={rate.price}>
      <c-oda-rate-table-row-item
        price={rate.price}
        amount={amount}
        term-length={rate.termLength}
        selected-rate={selectedRate}
        quote-id={rate.quoteId}
        onselection={onItemSelection}
      ></c-oda-rate-table-row-item>
    </td>
  </template>
</template>
