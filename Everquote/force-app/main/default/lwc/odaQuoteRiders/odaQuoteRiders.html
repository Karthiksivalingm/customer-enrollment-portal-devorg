<template>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_medium">Quote Riders</div>
      <br />
    </div>

    <div class="slds-col slds-size_1-of-1">
      <c-oda-dc-rider
        if:true={isDcRiderVisible}
        product={product}
        quote={quote}
        age={lead.Age__c}
        onaddpolicychange={handleSelectedRiderChange}
        onridervaluechange={handleRiderValueChanged}
      ></c-oda-dc-rider>
      <c-oda-ad-rider
        if:true={isAdRiderVisible}
        product={product}
        face-amount={faceAmount}
        age={lead.Age__c}
        amount-range={amountRange}
        onaddpolicychange={handleSelectedRiderChange}
        onridervaluechange={handleRiderValueChanged}
      ></c-oda-ad-rider>
      <c-oda-wp-rider
        if:true={isWpRiderVisible}
        product={product}
        face-amount={faceAmount}
        term-length={termLength}
        age={lead.Age__c}
        tobacco={lead.Use_Tobacco__c}
        onaddpolicychange={handleSelectedRiderChange}
        onridervaluechange={handleRiderValueChanged}
      ></c-oda-wp-rider>
    </div>

    <div class="slds-col slds-size_1-of-1">
      <br />
      <div class="slds-text-heading_medium">Policy Summary</div>
      <br />
    </div>

    <div class="slds-col slds-size_1-of-1">
      <div class="slds-grid slds-grid_align-spread">
        <div class="slds-col">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="base-premium">Base premium</label>
            <div class="slds-form-element__control">
              <input
                type="text"
                id="base-premium"
                value={basePremiumText}
                disabled
                class="slds-input"
              />
            </div>
          </div>
        </div>

        <template for:each={selectedRidersElements} for:item="rider" for:index="index">
          <div key={rider.key} class="slds-col">
            <div class="slds-form-element">
              <label class="slds-form-element__label" for={rider.id}>{rider.name}</label>
              <div class="slds-form-element__control">
                <input type="text" id={rider.id} value={rider.value} disabled class="slds-input" />
              </div>
            </div>
          </div>
        </template>

        <div class="slds-col">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="total-monthly-premium">
              Total Monthly Premium
            </label>
            <div class="slds-form-element__control">
              <input
                type="text"
                id="total-monthly-premium"
                value={totalMonthlyPremium}
                disabled
                class="slds-input"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
