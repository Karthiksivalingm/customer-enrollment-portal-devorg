<template>
    <div role="alert" class={alertContainerClass}>
        <span class="slds-assistive-text">{type} Alert</span>
        <div class="slds-grid slds-grid_align-spread slds-size_1-of-1">
            
            <!-- Icon Section -->
            <div class="slds-col slds-size_1-of-12 slds-align-middle">
                <lightning-icon 
                    icon-name={iconName} 
                    variant={iconVariant} 
                    size="small"
                    alternative-text={type}>
                </lightning-icon>
            </div>

            <!-- Message Section -->
            <!-- Removed slds-truncate here to allow the text to wrap and dynamically fit the container size -->
            <div class="slds-col slds-size_11-of-12 slds-m-left_small slds-text-heading_small slds-text-align_left" title={message}>
                {message}
            </div>
        </div>
    </div>
</template>
