<template>
    <lightning-quick-action-panel header="New PandaDoc">
        <div class="slds-is-relative">
            Creating a new {objectApiName} document using "{template.name}" template. Click "Create" to proceed.
            <lightning-spinner lwc:if={isLoading} alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" label="Create" class="slds-m-left_x-small" onclick={handleCreate}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
