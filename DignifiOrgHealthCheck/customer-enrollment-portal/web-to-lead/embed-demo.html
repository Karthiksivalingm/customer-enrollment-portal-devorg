<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed demo - Customer Enrollment Form</title>
    <link rel="icon" href="data:," />
    <!--
      DEMO ONLY: a stand-in for the client's existing website, showing how the
      enrollment form is embedded. Nothing on this page is part of the form.
    -->
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: #222;
        background: #f6f5f2;
      }
      .demo-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.5rem;
        padding: 1rem 1.5rem;
        background: #2d2d2d;
        color: #fff;
      }
      .demo-nav strong {
        margin-right: auto;
        font-size: 1.125rem;
      }
      .demo-nav a {
        color: #ddd;
        text-decoration: none;
      }
      .demo-content {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      .demo-content h1 {
        margin: 0 0 0.5rem;
      }
      .demo-note {
        margin: 0 0 1.5rem;
        color: #555;
      }
      /* The form is responsive; the iframe only needs to be full width. */
      .enrollment-frame {
        display: block;
        width: 100%;
        border: 0;
      }
      .demo-footer {
        padding: 1.5rem;
        text-align: center;
        background: #2d2d2d;
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <nav class="demo-nav" aria-label="Example client site">
      <strong>Example Client Ltd</strong>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main class="demo-content">
      <h1>Become a customer</h1>
      <p class="demo-note">
        Complete the form below to enroll your company and its contacts.
      </p>

      <!-- ===== Copy from here: the embed code ===== -->
      <iframe
        id="enrollment-form"
        class="enrollment-frame"
        src="https://YOUR-DOMAIN.example/enrollment/index.html"
        title="Customer Enrollment Form"
        width="100%"
        height="1100"
        frameborder="0"
      ></iframe>
      <script>
        // Optional: grows/shrinks the iframe to fit the form and keeps the current
        // step in view. Without this script the iframe keeps its fixed height and
        // scrolls internally.
        (function () {
          var frame = document.getElementById("enrollment-form");

          // DEMO ONLY: ?formUrl=<url> overrides the iframe address for local testing.
          var override = new URLSearchParams(window.location.search).get("formUrl");
          if (override) {
            frame.src = override;
          }
          var formOrigin = new URL(frame.src, window.location.href).origin;

          window.addEventListener("message", function (event) {
            // Accept messages only from the form, in this iframe.
            if (event.origin !== formOrigin || event.source !== frame.contentWindow) {
              return;
            }
            var data = event.data || {};
            if (data.type === "ep-enrollment-form:height" && data.height > 0) {
              frame.style.height = Math.ceil(data.height) + "px";
            } else if (
              data.type === "ep-enrollment-form:step" ||
              data.type === "ep-enrollment-form:submitted"
            ) {
              // Bring the top of the form back into view when the step changes.
              if (frame.getBoundingClientRect().top < 0) {
                frame.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            }
          });
        })();
      </script>
      <!-- ===== Copy to here ===== -->
    </main>

    <footer class="demo-footer">&copy; Example Client Ltd</footer>
  </body>
</html>
