<template>
    <lightning-quick-action-panel header="Confirmation">

        <p class="slds-p-around_medium">
            Are you sure you want to Resolve this Case?
        </p>

        <div slot="footer">
            <lightning-button 
                label="Cancel" 
                onclick={handleCancel}>
            </lightning-button>

            <lightning-button 
                label="Resolve" 
                variant="brand" 
                class="slds-m-left_small"
                onclick={handleResolve}>
            </lightning-button>
        </div>

    </lightning-quick-action-panel>
</template>
