<template>
  <c-loading-spinner if:true={loading}></c-loading-spinner>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_large">Begin a New Application</div>
    </div>

    <!-- RISK CLASS -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <div class="slds-text-heading_medium">Select Risk Class</div>
    </div>

    <div class="slds-col slds-size_1-of-3">
      <lightning-combobox
        name="riskClass"
        placeholder="Choose one..."
        onchange={onRiskClassChange}
        options={riskClasses}
      ></lightning-combobox>
    </div>

    <!-- QUOTE TABLE -->
    <div class="slds-col slds-size_1-of-1 slds-border_bottom" id="quote-table">
      <lightning-datatable
        columns={columns}
        data={quotes}
        key-field="quoteId"
        max-row-selection={maxRowSelection}
        onrowselection={onQuoteRowSelection}
      ></lightning-datatable>

      <template if:true={hasNoQuotes}>
        <div class="slds-m-top_medium">
          <div class="slds-align_absolute-center">
            <lightning-icon
              icon-name="utility:recurring_exception"
              alternative-text="No Data"
            ></lightning-icon>
          </div>
          <div class="slds-align_absolute-center slds-text-heading_small">
            No Quotes Loaded
          </div>
        </div>
      </template>
    </div>

    <!-- Adjust Face Amount -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <div class="slds-text-heading_medium">Adjust Face Amount</div>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <lightning-input
        type="number"
        name="faceAmount"
        label="Face Amount"
        value={selectedFaceAmount}
        disabled={hasNoSelectedQuote}
        onchange={onFaceAmountChange}
      ></lightning-input>
    </div>

    <div class="slds-col slds-size_2-of-4">
      <c-oda-slider
        step="1000"
        max-value={sliderMaxValue}
        min-value="5000"
        value={selectedFaceAmount}
        is-disabled={hasNoSelectedQuote}
        onslidervaluechange={onFaceAmountChange}
      ></c-oda-slider>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <c-stretched-button
        variant="brand"
        label="Confirm Quotes"
        is-disabled={hasNoSelectedQuote}
        onselection={onConfirmQuote}
      ></c-stretched-button>
    </div>

    <!-- CONFIRMED QUOTE TABLE -->
    <div class="slds-col slds-size_1-of-1 slds-border_bottom" id="confirmed-quote-table">
      <lightning-datatable
        columns={columns}
        data={confirmedQuotes}
        key-field="quoteId"
        max-row-selection={maxRowSelection}
        onrowselection={onConfirmedQuoteSelection}
      ></lightning-datatable>

      <template if:true={hasNoConfirmedQuotes}>
        <div class="slds-m-top_medium"></div>
        <div class="slds-align_absolute-center">
          <lightning-icon
            icon-name="utility:recurring_exception"
            alternative-text="No Data"
          ></lightning-icon>
        </div>
        <div class="slds-align_absolute-center slds-text-heading_small">
          No Quotes Confirmed
        </div>
      </template>
    </div>

    <!-- E-App -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <c-stretched-button
        label="Launch E-App"
        onselection={onLaunchEapp}
        variant="success"
        is-disabled={isLaunchEappDisabled}
      ></c-stretched-button>
    </div>

    <c-oda-quote-riders
      product={product}
      lead={lead}
      quote={selectedConfirmedQuote}
      onriderschange={handleRidersChange}
    ></c-oda-quote-riders>
  </div>
</template>
