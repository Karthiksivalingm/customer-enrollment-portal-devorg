<template>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_small"><b>Waiver of Premium</b></div>

      <div>Product Selected</div>
      <div>Select final quote above before calculating</div>
      <br />
    </div>

    <div class="slds-col slds-size_1-of-4">
      <div class="slds-form-element">
        <label class="slds-form-element__label" for="term-length">Term Length</label>
        <div class="slds-form-element__control">
          <input type="text" id="term-length" value={termLengthText} disabled class="slds-input" />
        </div>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <div class="slds-form-element">
        <label class="slds-form-element__label" for="wp-face-amount">Face Amount</label>
        <div class="slds-form-element__control">
          <input
            type="text"
            id="wp-face-amount"
            value={faceAmountText}
            disabled
            class="slds-input"
          />
        </div>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-6 slds-align-bottom">
      <button
        class="slds-button slds-button_brand slds-button_stretch"
        disabled={isCalculateDisabled}
        onclick={onWpCalculateRates}
      >
        Calculate
      </button>
    </div>

    <div class="slds-col slds-size_1-of-5">
      <div class="slds-form-element">
        <label class="slds-form-element__label" for="wp-additional-premium"
          >Additional Premium</label
        >
        <div class="slds-form-element__control">
          <input
            type="text"
            id="wp-additional-premium"
            value={additionalPremiumText}
            disabled
            class="slds-input"
          />
        </div>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-10">
      <c-oda-toggle
        label={addPolicyToggleLabel}
        checked={checked}
        is-disabled={addToPolicyDisabled}
        ontogglechange={handlePolicySelected}
      ></c-oda-toggle>
    </div>
  </div>
</template>
