<template>
<template if:true={showSpinner}>
            <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>

</template>

    <lightning-card title="Premium and Policies Calculation" class="slds-p-around_medium">
        <div class="slds-m-bottom_medium">
            <lightning-combobox
                name="selectterms"
                label="Select Term type"
                value={value}
                placeholder="Select"
                options={options}
                onchange={handleChange}>
            </lightning-combobox>
        </div>

        <template if:true={showPremium}>
            <div class="slds-text-heading_small slds-m-bottom_medium">If agent talk in terms of Premium ($$)</div>
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="number" label="Dollar of Premium - last month" step="0.01" formatter="currency" value={premiumLastMonth} onchange={handleInputChange} data-id="premiumLastMonth" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="number" label="Avg Dollar per premium - last month" step="0.01" formatter="currency" value={avgPremiumLastMonth} onchange={handleInputChange} data-id="avgPremiumLastMonth" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="number" label="Desired amount ($$) of premium" step="0.01" formatter="currency" value={desiredPremium} onchange={handleInputChange} data-id="desiredPremium" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input  type="number" step="0.01" label="Bind Rate (%)"  value={bindRate} onchange={handleInputChange} data-id="bindRate" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
            </div>
            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">GAP $$: {gapPremium}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">GAP Policies: {gapPolicies}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated Number of leads per day: {estimatedLeadsPerDay}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated Number of leads per month: {estimatedLeadsPerMonth}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated cost of leads per WEEK: {estimatedCostPerWeek}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated cost of leads per MONTH: {estimatedCostPerMonth}</div>
                </div>
            </div>
        </template>

        <template if:true={showPolicy}>
            <div class="slds-text-heading_small slds-m-bottom_medium">If agent talk in terms of Number of Policies</div>
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="number" step="0.01" label="# of policies bound last month" value={policiesLastMonth} onchange={handleInputChange} data-id="policiesLastMonth" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="number" step="0.01" label="Avg $$ of each policy last month" formatter="currency" value={avgPolicyLastMonth} onchange={handleInputChange} data-id="avgPolicyLastMonth" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="number" step="0.01" label="Desired # of policies each month" value={desiredPolicies} onchange={handleInputChange} data-id="desiredPolicies" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input  type="number" step="0.01"  label="Bind Rate (%)"  value={bindRate} onchange={handleInputChange} data-id="bindRate" class="highlighted-input slds-m-bottom_small"></lightning-input>
                </div>
            </div>
            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">GAP Policies: {gapPolicies}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">GAP $$: {gapPremium}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated Number of leads per day: {estimatedLeadsPerDay}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated Number of leads per month: {estimatedLeadsPerMonth}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated cost of leads per WEEK: {estimatedCostPerWeek}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="result-row">Estimated cost of leads per MONTH: {estimatedCostPerMonth}</div>
                </div>
            </div>
        </template>

        <div class="slds-text-heading_small slds-m-top_medium">Enter cost for each lead the agent wants</div>
        <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
            <div class="slds-col slds-size_1-of-3">
                <lightning-input type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="autoPremium" label="Auto/Premium" value={autoPremium} formatter="currency"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-input type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="autoPreferred" label="Auto/Preferred" value={autoPreferred} formatter="currency"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-input type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="autoStandard" label="Auto/Standard" value={autoStandard} formatter="currency"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-input  type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="autoNonStandard" label="Auto/Non-Standard" value={autoNonStandard} formatter="currency"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-input type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="finalExpense" label="Final Expense" value={finalExpense} formatter="currency"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-input type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="homePremium" label="Home/Premium" value={homePremium} formatter="currency"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-input type="number" step="0.01" class="highlighted-input" onchange={handleInputChange} data-id="homeBasic" label="Home/Basic" value={homeBasic} formatter="currency"></lightning-input>
            </div>
        <!--<div class="slds-col slds-size_1-of-3">
                <lightning-input type="text" label="Last Completed By" value={lastCompletedBy} readonly></lightning-input>
            </div>
             <div class="slds-col slds-size_1-of-3">
                <lightning-input type="text" label="Last Completed Date" value={formatlastCompletedDate} readonly></lightning-input>
            </div> --> 
        </div>

        <div class="slds-m-top_medium slds-align_absolute-center">
            <lightning-button label="Save" onclick={handleSave} class="slds-m-right_medium"></lightning-button>
            <lightning-button label="Clear" onclick={handleReset}></lightning-button>
        </div>
        <template if:true={isModalOpen}>
			<section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<!-- Modal/Popup Header -->
					<header class="slds-modal__header" style="background-color: #c5cace;">
						<h2 class="slds-modal__title">Confirmation</h2>
					</header>
					<!-- Modal/Popup Body -->
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id">
						<h2 class="slds-align_absolute-center">Are you sure you want to clear data? The populated Gap Calculator fields will be deleted from database.</h2>
					</div>
					<!-- Modal/Popup Footer -->
					<footer class="slds-modal__footer slds-p-around_none" style="background-color: #c5cace;">
								<div class="slds-align_absolute-center">
									<span class="slds-p-around_small">
										<lightning-button variant="neutral" label="Cancel" title="Cancel"
											onclick={cancelModalAction}></lightning-button>
									</span>
									<span >
										<lightning-button variant="neutral" label="Ok" title="Ok"
											onclick={okModalAction}></lightning-button>
									</span>
								</div>
					</footer>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</template>
    </lightning-card>
</template>
