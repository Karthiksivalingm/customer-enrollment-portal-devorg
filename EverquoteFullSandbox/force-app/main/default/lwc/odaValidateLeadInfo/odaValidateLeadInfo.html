<template>
  <c-loading-spinner if:true={isLoading}></c-loading-spinner>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_medium">Please fix the following lead details</div>
      <br />
    </div>

    <div if:false={genderIsValid} class="slds-col slds-size_1-of-3">
      <lightning-combobox
        label="Gender"
        name="gender"
        placeholder="Choose one..."
        onchange={onGenderChange}
        options={genderOptions}
      ></lightning-combobox>
    </div>

    <div if:false={stateIsValid} class="slds-col slds-size_1-of-3">
      <lightning-combobox
        label="State"
        name="state"
        placeholder="Choose one..."
        onchange={onStateChange}
        options={stateOptions}
      ></lightning-combobox>
    </div>

    <div if:false={dateOfBirthIsValid} class="slds-col slds-size_1-of-3">
      <lightning-input
        type="date"
        name="datOfBirth"
        label="Date Of Birth"
        value={lead.Date_of_Birth__c}
        onchange={onDateOfBirthChange}
      ></lightning-input>
    </div>
  </div>
  <br />

  <lightning-button
    variant="brand"
    disabled={saveButtonDisabled}
    onclick={saveLeadDetails}
    label="Save"
  >
    Save
  </lightning-button>
</template>
