<template>
  <div class={cellClass}>
    <template if:true={isActive}>
      <div
        class="slds-truncate slds-align_absolute-center active"
        title={price}
        onclick={onSelection}
      >
        <lightning-formatted-number
          value={price}
          format-style="currency"
          currency-code="USD"
        ></lightning-formatted-number>
        <template if:true={hasNumber}>/mo</template>
      </div>
    </template>
    <template if:false={isActive}>
      <div class="slds-truncate slds-align_absolute-center" title={price} onclick={onSelection}>
        <lightning-formatted-number
          value={price}
          format-style="currency"
          currency-code="USD"
        ></lightning-formatted-number>
        <template if:true={hasNumber}>/mo</template>
        <template if:false={hasNumber}>{price}</template>
      </div>
    </template>
  </div>
</template>
