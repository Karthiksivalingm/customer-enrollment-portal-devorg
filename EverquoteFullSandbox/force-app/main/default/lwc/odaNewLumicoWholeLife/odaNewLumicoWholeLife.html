<template>
  <c-loading-spinner if:true={loading}></c-loading-spinner>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_large">Begin a New Application</div>
    </div>

    <div class="slds-col slds-size_1-of-1">
      <c-oda-level-term-user-info
        lead={lead}
        coverage-options={coverageOptions}
        onfetchleveltermrates={fetchWholeLifeRates}
        risk-class-details={riskClassDetails}
        build-risk-class={buildRiskClass}
        override-risk-class={overrideRiskClass}
      ></c-oda-level-term-user-info>
    </div>

    <!-- Rates table -->
    <div class="slds-col slds-size_1-of-1 slds-border_bottom margin-top-25" id="rate-table">
      <lightning-datatable
        columns={columns}
        data={rates}
        key-field="id"
        max-row-selection="1"
        onrowselection={onRateRowSelection}
      ></lightning-datatable>
    </div>

    <!-- Adjust Face Amount -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <div class="slds-text-heading_medium">Adjust Face Amount</div>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <lightning-input
        type="number"
        name="faceAmount"
        value={faceAmount}
        disabled={hasNoSelectedFaceAmount}
        onchange={onFaceAmountChange}
      ></lightning-input>
    </div>

    <div class="slds-col slds-size_2-of-4 slds-align-bottom">
      <c-oda-slider
        min-value={sliderMinValue}
        max-value={sliderMaxValue}
        step={sliderStep}
        value={faceAmount}
        is-disabled={hasNoSelectedFaceAmount}
        onslidervaluechange={onFaceAmountChange}
      ></c-oda-slider>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <div class="slds-form-element__label slds-no-flex"></div>
      <c-stretched-button
        label="Confirm Quotes"
        variant="brand"
        is-disabled={hasNoSelectedFaceAmount}
        onselection={onConfirmQuotes}
      ></c-stretched-button>
    </div>

    <!-- Quotes table -->
    <div class="slds-col slds-size_1-of-1 slds-border_bottom margin-top-25" id="quote-table">
      <lightning-datatable
        columns={columns}
        data={quotes}
        key-field="id"
        max-row-selection="1"
        onrowselection={onQuoteRowSelection}
      ></lightning-datatable>
    </div>

    <!-- E-App -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <c-stretched-button
        label="Launch E-App"
        onselection={onLaunchEapp}
        variant="success"
        is-disabled={isLaunchEappDisabled}
      ></c-stretched-button>
    </div>

    <c-oda-quote-riders
      product={product}
      quote={selectedQuote}
      lead={lead}
      onriderschange={handleRidersChange}
    ></c-oda-quote-riders>
  </div>
</template>
