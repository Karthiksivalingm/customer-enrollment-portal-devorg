<template>
  <c-loading-spinner if:true={loading}></c-loading-spinner>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_large">Begin a New Application</div>
    </div>

    <!-- Level Term extra info -->
    <div if:true={isLevelTermProduct} class="slds-col slds-size_1-of-1">
      <c-oda-level-term-user-info
        lead={lead}
        coverage-options={coverageOptions}
        onfetchleveltermrates={fetchLevelTermRates}
        risk-class-details={riskClassDetails}
        build-risk-class={buildRiskClass}
        override-risk-class={overrideRiskClass}
      ></c-oda-level-term-user-info>
    </div>

    <!-- RATE TABLE -->
    <table class="slds-table slds-table_cell-buffer slds-table_bordered margin-top-25">
      <thead>
        <tr class="slds-line-height_reset">
          <th class="" scope="col">
            <div class="slds-truncate slds-align_absolute-center" title="Face Amount">
              Face Amount
            </div>
          </th>
          <th class="" scope="col" colspan="4">
            <div class="slds-truncate slds-align_absolute-center" title="Term Length">
              Term Length
            </div>
          </th>
        </tr>
        <tr class="slds-line-height_reset">
          <th class="" scope="col">
            <div class="slds-truncate slds-align_absolute-center" title=""></div>
          </th>
          <template for:each={termLengths} for:item="termLength">
            <th class="" scope="col" key={termLength}>
              <div class="slds-truncate slds-align_absolute-center" title={termLength}>
                {termLength} Years
              </div>
            </th>
          </template>
        </tr>
      </thead>
      <tbody>
        <template for:each={rateTableVals} for:item="rateTableVal" for:index="rateTableIndex">
          <c-oda-rate-table-row
            key={rateTableVal.keyVal}
            rate-table={rateTableVal}
            onselection={onPriceSelection}
            selected-rate={selectedRate}
          ></c-oda-rate-table-row>
        </template>
      </tbody>
    </table>

    <!-- Adjust Face Amount -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <div class="slds-text-heading_medium">Adjust Face Amount</div>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <lightning-input
        type="number"
        name="faceAmount"
        value={selectedFaceAmount}
        disabled={hasNoSelectedFaceAmount}
        onchange={onFaceAmountChange}
      ></lightning-input>
    </div>

    <div class="slds-col slds-size_2-of-4 slds-align-bottom">
      <c-oda-slider
        min-value={sliderMinValue}
        max-value={sliderMaxValue}
        step={sliderStep}
        value={selectedFaceAmount}
        is-disabled={hasNoSelectedFaceAmount}
        onslidervaluechange={onFaceAmountChange}
      ></c-oda-slider>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <div class="slds-form-element__label slds-no-flex"></div>
      <c-stretched-button
        label="Confirm Quotes"
        variant="brand"
        is-disabled={hasNoSelectedFaceAmount}
        onselection={onConfirmQuote}
      ></c-stretched-button>
    </div>

    <!-- confirm -->
    <table
      class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped margin-top-25"
    >
      <thead>
        <tr class="slds-line-height_reset">
          <th class="" scope="col">
            <div class="slds-truncate slds-align_absolute-center" title="Face Amount">
              Face Amount
            </div>
          </th>
          <th class="" scope="col" colspan="4">
            <div class="slds-truncate slds-align_absolute-center" title="Term Length">
              Term Length
            </div>
          </th>
        </tr>
        <tr>
          <th class="" scope="col"></th>
          <template for:each={confirmedTermLengths} for:item="termLength">
            <th class="" scope="col" key={termLength}>
              <div class="slds-truncate slds-align_absolute-center" title={termLength}>
                {termLength} Years
              </div>
            </th>
          </template>
        </tr>
      </thead>
      <tbody>
        <template for:each={confirmedRates} for:item="rateTableVal" for:index="rateTableIndex">
          <c-oda-rate-table-row
            key={rateTableVal.keyVal}
            rate-table={rateTableVal}
            onselection={onClickConfirmedRate}
            selected-rate={selectedConfirmedRate}
          ></c-oda-rate-table-row>
        </template>
      </tbody>
    </table>

    <!-- E-App -->
    <div class="slds-col slds-size_1-of-1 margin-top-25">
      <c-stretched-button
        label="Launch E-App"
        onselection={onLaunchEapp}
        variant="success"
        is-disabled={isLaunchEappDisabled}
      ></c-stretched-button>
    </div>

    <c-oda-quote-riders
      product={product}
      quote={selectedConfirmedRate}
      lead={lead}
      onriderschange={handleRidersChange}
    ></c-oda-quote-riders>
  </div>
</template>
