<template>
  <c-loading-spinner if:true={loading}></c-loading-spinner>
  <div class="slds-card-wrapper">
    <div if:true={leadLoaded} class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
      <div class="slds-col slds-size_1-of-1">
        <lightning-combobox
          class="lead-outcome-combobox"
          autocomplete="off"
          id="lead-outcome-combobox"
          label="Lead Outcome"
          name="leadOutcome"
          placeholder={placeholder}
          onchange={onLeadOutcomeChange}
          options={leadOutcomeOptions}
          value={leadOutcomeValue}
        ></lightning-combobox>
      </div>
    </div>
  </div>

  <c-oda--lead-outcome-modal
    lead-id={leadId}
    is-open={isModalOpen}
    onmodalclosed={handleModalClose}
    oncancel={handleModalCancel}
  ></c-oda--lead-outcome-modal>
</template>
