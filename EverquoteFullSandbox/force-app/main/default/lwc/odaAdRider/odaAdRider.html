<template>
  <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
    <div class="slds-col slds-size_1-of-1">
      <div class="slds-text-heading_small"><b>Accidental Death</b></div>
      <div>Select final quote above before calculating</div>
      <br />
    </div>

    <div class="slds-col slds-size_1-of-4">
      <div class="slds-form-element">
        <label class="slds-form-element__label" for="face-amount">Face Amount</label>
        <div class="slds-form-element__control">
          <input type="text" id="face-amount" value={faceAmountText} disabled class="slds-input" />
        </div>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-4">
      <div class="slds-form-element">
        <label class="slds-form-element__label" for="benefit-amount">Select Benefit Amount</label>

        <div class="slds-form-element__control">
          <input
            type="number"
            id="benefit-amount"
            class="slds-input benefit-amount"
            min="minBenefitAmount"
            max="maxBenefitAmount"
            disabled={isBenefitAmountDisabled}
            oninput={onBenefitAmountChange}
            value={benefitAmount}
            required
          />

          <input
            type="text"
            id="benefit-amount-2"
            class="slds-input benefit-amount-multiplier"
            value="000"
            disabled
          />
        </div>

        <template
          if:false={benefitAmountValid}
          for:each={errorMessages}
          for:item="error"
          for:index="index"
        >
          <div key={error} class="slds-form-element__help slds-required">
            {error}
          </div>
        </template>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-6 slds-align-bottom">
      <button
        class="slds-button slds-button_brand slds-button_stretch"
        disabled={isCalculateDisabled}
        onclick={onADCalculateRates}
      >
        Calculate
      </button>

      <template
        if:false={benefitAmountValid}
        for:each={errorMessages}
        for:item="error"
        for:index="index"
      >
        <div key={error} class="slds-form-element__help slds-required">
          <br />
        </div>
      </template>
    </div>

    <div class="slds-col slds-size_1-of-5">
      <div class="slds-form-element">
        <label class="slds-form-element__label" for="ad-additional-premium"
          >Additional Premium</label
        >
        <div class="slds-form-element__control">
          <input
            type="text"
            id="ad-additional-premium"
            value={additionalPremiumText}
            disabled
            class="slds-input"
          />
        </div>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-10">
      <c-oda-toggle
        label={addPolicyToggleLabel}
        checked={checked}
        is-disabled={addToPolicyDisabled}
        ontogglechange={handlePolicySelected}
      ></c-oda-toggle>
    </div>
  </div>
</template>
