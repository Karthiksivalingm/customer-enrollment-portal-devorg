<template>
  <template if:true={isOpen}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open slds-modal_medium"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
    >
      <c-loading-spinner if:true={loading}></c-loading-spinner>

      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate slds-text-align_left">
            Enter Policies
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
          <template for:each={policies} for:item="policy">
            <div class="policy-wrapper" key={policy.componentId}>
              <c-oda-policy
                lead-id={leadId}
                policy={policy}
                onpolicyupdated={handlePolicyUpdated}
              ></c-oda-policy>
              <button
                if:true={policyCanBeRemoved}
                class="slds-button slds-button_destructive slds-m-top_small"
                onclick={handleRemovePolicy}
                data-id={policy.componentId}
              >
                <lightning-icon
                  icon-name="utility:delete"
                  size="xx-small"
                  alternative-text="delete"
                  class="delete-icon"
                ></lightning-icon>
                Remove policy
              </button>
            </div>
          </template>
          <button
            class="slds-button slds-button_outline-brand"
            onclick={addPolicy}
            title="Add another policy"
          >
            <lightning-icon
              icon-name="utility:add"
              size="xx-small"
              alternative-text="add"
              variant="brand"
              class="add-icon"
            ></lightning-icon>
            Add another policy
          </button>
        </div>
        <footer class="slds-modal__footer">
          <div class="slds-col slds-size_1-of-1">
            <div class="slds-grid slds-grid_align-spread">
              <div class="slds-col">
                <button class="slds-button slds-button_brand" onclick={save} title="Save">
                  Save
                </button>
              </div>
              <div class="slds-col">
                <button
                  class="slds-button slds-button_text-destructive"
                  onclick={cancel}
                  title="Cancel"
                >
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
